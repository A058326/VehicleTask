<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ניווט ראשי (Bootstrap Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">מידע כלי רכב</a>
      </div>
    </nav>

    <div class="container">
      <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-12 col-md-8">
          <!-- טופס חיפוש מספר רישוי באמצע הדף -->
          <form id="searchForm" class="mb-4 text-center">
            <div class="input-group input-group-lg justify-content-center">
              <input
                type="text"
                class="form-control w-50 mx-auto"
                id="licenseInput"
                placeholder="הכנס מספר רישוי"
                required
              />
              <button class="btn btn-primary px-4" type="submit">חפש</button>
            </div>
          </form>
        </div>
      </div>
      <!-- אזור תוצאות מתחת לשורת החיפוש -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-10">
          <div id="results" class="row g-3">
            <!-- כאן יוצגו כרטיסי הרכב -->
          </div>
        </div>
      </div>
    </div>

    <!-- קישורים ל־Bootstrap ו־jQuery -->
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- קובץ JS מותאם אישית -->
    <script src="script.js"></script>
  </body>
</html>

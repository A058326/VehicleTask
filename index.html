<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Info Car Israel</title>
    <!-- Favicon -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ניווט ראשי (Bootstrap Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">מידע כלי רכב</a>
      </div>
    </nav>

    <div class="container">
      <!-- טופס חיפוש בתוך כרטיס -->
      <div class="search-row mb-4" dir="rtl">
        <form id="searchForm" class="w-100" dir="rtl">
          <div class="card search-card w-100 p-4 mb-0">
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <input
                  type="text"
                  class="form-control"
                  id="licenseInput"
                  placeholder="הכנס מספר רישוי"
                  style="text-align: right"
                />
              </div>
              <div class="col-12 col-md-4">
                <input
                  type="text"
                  class="form-control"
                  id="modelInput"
                  placeholder="הכנס דגם רכב"
                  style="text-align: right"
                />
              </div>
              <div class="col-12 col-md-4">
                <input
                  type="text"
                  class="form-control"
                  id="colorInput"
                  placeholder="הכנס צבע רכב"
                  style="text-align: right"
                />
              </div>
              <div class="col-12 col-md-4">
                <input
                  type="text"
                  class="form-control"
                  id="yearInput"
                  placeholder="הכנס שנה"
                  style="text-align: right"
                />
              </div>
              <div class="col-12 col-md-4">
                <input
                  type="text"
                  class="form-control"
                  id="makerInput"
                  placeholder="הכנס יצרן"
                  style="text-align: right"
                />
              </div>
              <div class="col-12 col-md-4">
                <select
                  class="form-select"
                  id="sortSelect"
                  style="text-align: right"
                >
                  <option value="">מיין לפי...</option>
                  <option value="model">יצרן (א-ב)</option>
                  <option value="year">שנה</option>
                  <option value="license">מספר רישוי</option>
                </select>
              </div>
            </div>
          </div>
          <div class="row mt-3 align-items-center">
            <div
              class="col-12 col-md-6 d-flex justify-content-end mb-2 mb-md-0"
            >
              <button class="btn btn-primary px-4" type="submit">חפש</button>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-start gap-2">
              <button
                class="btn btn-secondary px-3"
                type="button"
                id="clearFieldsBtn"
              >
                נקה שדות
              </button>
              <button
                class="btn btn-secondary px-3"
                type="button"
                id="clearResultsBtn"
              >
                נקה תוצאות
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- אזור תוצאות -->
      <div id="results" class="row g-3" dir="rtl">
        <!-- כאן יוצגו כרטיסי הרכב -->
      </div>
    </div>

    <!-- קישורים ל־Bootstrap ו־jQuery -->
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- קובץ JS מותאם אישית -->
    <script src="script.js"></script>
  </body>
</html>
